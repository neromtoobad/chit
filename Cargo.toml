[workspace]
resolver = "2"
members = ["core", "wasm", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
orchard = { version = "0.16", default-features = false, features = ["std"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = { version = "0.31", default-features = false, features = ["std"] }
zcash_protocol = "0.11"
zcash_keys = { version = "0.17", default-features = false, features = ["orchard", "sapling", "std"] }
bech32 = "0.11"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
