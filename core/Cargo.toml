[package]
name = "chit-core"
description = "Payment disclosures for Zcash Orchard and Ironwood outputs (ZIP 311)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orchard.workspace = true
zcash_note_encryption.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
zcash_keys.workspace = true
bech32.workspace = true
hex.workspace = true
chacha20poly1305 = { version = "0.11", default-features = false }
subtle = "2"
pasta_curves = { version = "0.6", features = ["alloc"] }
ff = "0.14"
group = "0.14"
blake2b_simd = "1"
zcash_address = "0.14"

[dev-dependencies]
proptest = "1"
serde_json = "1"
orchard = { version = "0.16", features = ["circuit"] }
zcash_keys = { version = "0.17", default-features = false, features = ["orchard", "sapling", "std", "test-dependencies"] }
rand = "0.10"
zcash_primitives.workspace = true
zcash_protocol.workspace = true
hex.workspace = true
